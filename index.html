<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가위바위보">
<meta name="description" content="화면을 누르면 주먹·가위·보 중 하나가 랜덤으로 크게 나오는 가위바위보">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
<style>
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
  body { margin: 0; font-size: 14px; }
</style>
<title>가위바위보 한 판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* Layout: one full-screen tap target; the whole screen turns the color of your hand */
  :root {
    --ink: #1b1a17;
    --paper: #f3efe6;
    --idle: #2a2833;
    --rock: #e2483d;
    --scissors: #2f6fe0;
    --paper-hand: #f2b51d;
    --on-dark: #fffaf0;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--idle);
    color: var(--on-dark);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color .25s ease;
  }
  body.rock { background: var(--rock); }
  body.scissors { background: var(--scissors); }
  body.paper { background: var(--paper-hand); color: var(--ink); }

  #stage {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 24px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    align-items: center;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    text-align: center;
  }
  #stage:focus-visible { outline: 4px solid currentColor; outline-offset: -10px; }

  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    letter-spacing: .08em;
  }
  .top span { opacity: .75; }
  #sound {
    font: inherit;
    font-size: 14px;
    letter-spacing: 0;
    color: inherit;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid currentColor;
    background: transparent;
    cursor: pointer;
  }
  #sound[aria-pressed="false"] { opacity: .55; }
  #sound:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }

  .center {
    display: grid;
    gap: 2vh;
    justify-items: center;
    align-content: center;
  }
  #hand {
    font-size: min(58vw, 42vh);
    line-height: 1;
    filter: drop-shadow(0 1.2vh 0 rgba(0,0,0,.18));
  }
  #word {
    font-family: var(--display);
    font-size: min(24vw, 15vh);
    line-height: 1;
    letter-spacing: .02em;
  }
  #hint {
    font-size: 17px;
    opacity: .8;
    min-height: 1.4em;
  }

  .pop { animation: pop .32s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .beat { animation: beat .4s ease-out; }
  @keyframes beat { 0% { transform: scale(1.25); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }

  .bottom {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 14px;
    opacity: .7;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    font-variant-numeric: tabular-nums;
  }
  body.paper .chip { background: rgba(0,0,0,.1); }

  @media (prefers-reduced-motion: reduce) {
    .pop, .beat { animation: none; }
    body { transition: none; }
  }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-live="polite">
  <div class="top">
    <span>가위바위보 · 각자 폰으로 동시에</span>
    <button id="sound" type="button" aria-pressed="true">🔊 소리 켜짐</button>
  </div>
  <div class="center">
    <div id="hand" aria-hidden="true">✊</div>
    <div id="word">준비</div>
    <div id="hint">화면 아무 데나 누르세요</div>
  </div>
  <div class="bottom" id="stats">
    <span class="chip">✊ 주먹 <b id="c-rock">0</b></span>
    <span class="chip">✌️ 가위 <b id="c-scissors">0</b></span>
    <span class="chip">✋ 보 <b id="c-paper">0</b></span>
  </div>
</div>

<script>
(() => {
  const HANDS = [
    { key: "rock", emoji: "✊", word: "주먹" },
    { key: "scissors", emoji: "✌️", word: "가위" },
    { key: "paper", emoji: "✋", word: "보" },
  ];
  const stage = document.getElementById("stage");
  const hand = document.getElementById("hand");
  const word = document.getElementById("word");
  const hint = document.getElementById("hint");
  const counts = { rock: 0, scissors: 0, paper: 0 };
  let busy = false;

  function fairRandom() {
    // 0,1,2 equally likely
    try {
      const buf = new Uint8Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= 255);
      return buf[0] % 3;
    } catch (e) {
      return Math.floor(Math.random() * 3);
    }
  }

  // voice (Korean text-to-speech built into the phone)
  let soundOn = true;
  try { soundOn = localStorage.getItem("rps-sound") !== "off"; } catch (e) {}
  const soundBtn = document.getElementById("sound");
  function renderSound() {
    soundBtn.textContent = soundOn ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
    soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  }
  renderSound();
  soundBtn.addEventListener("click", e => {
    e.stopPropagation();
    soundOn = !soundOn;
    try { localStorage.setItem("rps-sound", soundOn ? "on" : "off"); } catch (e2) {}
    if (!soundOn) { try { speechSynthesis.cancel(); } catch (e3) {} }
    renderSound();
  });
  let koVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      koVoice = vs.find(v => /^ko/i.test(v.lang)) || null;
    } catch (e) {}
  }
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
  function say(text, rate) {
    if (!soundOn) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      if (koVoice) u.voice = koVoice;
      u.rate = rate || 1.3;
      u.pitch = 1.1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  function animate(el, cls) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  function setBody(cls) {
    document.body.classList.remove("rock", "scissors", "paper");
    if (cls) document.body.classList.add(cls);
  }

  function play() {
    if (busy) return;
    busy = true;
    setBody(null);
    hint.textContent = "";
    try { speechSynthesis.cancel(); } catch (e) {}
    const beats = ["가위!", "바위!", "보!"];
    const shuffle = ["✌️", "✊", "✋"];
    let i = 0;
    const tick = () => {
      if (i < beats.length) {
        word.textContent = beats[i];
        hand.textContent = shuffle[i];
        animate(word, "beat");
        say(beats[i].replace("!", ""));
        buzz(30);
        i++;
        setTimeout(tick, 600);
        return;
      }
      const h = HANDS[fairRandom()];
      hand.textContent = h.emoji;
      word.textContent = h.word;
      setBody(h.key);
      animate(hand, "pop");
      animate(word, "pop");
      buzz(120);
      say(h.word + "!", 1.1);
      counts[h.key]++;
      document.getElementById("c-" + h.key).textContent = counts[h.key];
      hint.textContent = "다시 하려면 또 누르세요";
      setTimeout(() => { busy = false; }, 500);
    };
    tick();
  }

  stage.addEventListener("click", play);
  stage.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); play(); } });

  // keep the screen on while playing (optional)
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
