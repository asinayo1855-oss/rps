<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가위바위보">
<meta name="description" content="화면을 누르면 주먹·가위·보 중 하나가 랜덤으로 크게 나오는 가위바위보">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
<style>
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
  body { margin: 0; font-size: 14px; }
</style>
<title>가위바위보 한 판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
  /* Layout: one full-screen tap target; the whole screen turns the color of your hand */
  :root {
    --ink: #1b1a17;
    --paper: #f3efe6;
    --idle: #2a2833;
    --rock: #e2483d;
    --scissors: #2f6fe0;
    --paper-hand: #f2b51d;
    --on-dark: #fffaf0;
    --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--idle);
    color: var(--on-dark);
    font-family: var(--body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color .25s ease;
  }
  body.rock { background: var(--rock); }
  body.scissors { background: var(--scissors); }
  body.paper { background: var(--paper-hand); color: var(--ink); }

  #stage {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 24px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    align-items: center;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    text-align: center;
  }
  #stage:focus-visible { outline: 4px solid currentColor; outline-offset: -10px; }

  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    letter-spacing: .08em;
  }
  .top span { opacity: .75; }
  #sound {
    font: inherit;
    font-size: 14px;
    letter-spacing: 0;
    color: inherit;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid currentColor;
    background: transparent;
    cursor: pointer;
  }
  #sound[aria-pressed="false"] { opacity: .55; }
  #sound:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }

  .center {
    display: grid;
    gap: 2vh;
    justify-items: center;
    align-content: center;
  }
  #hand {
    font-size: min(58vw, 42vh);
    line-height: 1;
    filter: drop-shadow(0 1.2vh 0 rgba(0,0,0,.18));
  }
  #word {
    font-family: var(--display);
    font-size: min(24vw, 15vh);
    line-height: 1;
    letter-spacing: .02em;
  }
  #word.long { font-size: min(16vw, 12vh); white-space: nowrap; }
  #hint {
    font-size: 17px;
    opacity: .8;
    min-height: 1.4em;
  }

  .pop { animation: pop .32s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  .beat { animation: beat .4s ease-out; }
  .wiggle { animation: wiggle .5s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-14deg) } 75% { transform: rotate(14deg) } }
  @keyframes beat { 0% { transform: scale(1.25); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }

  .bottom {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 14px;
    opacity: .7;
  }
  .chip {
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    font-variant-numeric: tabular-nums;
  }
  body.paper .chip { background: rgba(0,0,0,.1); }

  @media (prefers-reduced-motion: reduce) {
    .pop, .beat, .wiggle { animation: none; }
    body { transition: none; }
  }
</style>
</head>
<body>
<div id="stage" role="button" tabindex="0" aria-live="polite">
  <div class="top">
    <span>가위바위보 · 각자 폰으로 동시에</span>
    <button id="sound" type="button" aria-pressed="true">🔊 소리 켜짐</button>
  </div>
  <div class="center">
    <div id="hand" aria-hidden="true">✊</div>
    <div id="word">준비</div>
    <div id="hint">화면 아무 데나 누르세요</div>
  </div>
  <div class="bottom" id="stats">
    <span class="chip">✊ 주먹 <b id="c-rock">0</b></span>
    <span class="chip">✌️ 가위 <b id="c-scissors">0</b></span>
    <span class="chip">✋ 보 <b id="c-paper">0</b></span>
  </div>
</div>

    // 0,1,2 equally likely
    try {
      const buf = new Uint8Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= 255);
      return buf[0] % 3;
    } catch (e) {
      return Math.floor(Math.random() * 3);
    }

  }

  function setBody(cls) {
    document.body.classList.remove("rock", "scissors", "paper");
    if (cls) document.body.classList.add(cls);
  }

  function play() {
    unlockAudio();
    if (busy) return;
    busy = true;
    setBody(null);
    hint.textContent = "";
    const shuffle = ["✊", "✌️", "✋"];

    // 자~
    word.textContent = "자~";
    hand.textContent = "✊";
    animate(word, "beat");
    animate(hand, "wiggle");
    say("ja");
    buzz(30);

    // 가위바위보! in one breath; hands show the moment "보" is said
    setTimeout(() => {
      word.textContent = "가위바위보!";
      word.classList.add("long");
      animate(word, "beat");
      say("gbb");
      buzz(30);
      let n = 0;
      const spin = setInterval(() => { hand.textContent = shuffle[n++ % 3]; }, 90);

      setTimeout(() => {
        clearInterval(spin);
        word.classList.remove("long");
        const h = HANDS[fairRandom()];
        hand.textContent = h.emoji;
        word.textContent = h.word;
        setBody(h.key);
        animate(hand, "pop");
        animate(word, "pop");
        buzz(120);
        setTimeout(() => say(RESULT_CLIP[h.key], 1.25), 380);
        counts[h.key]++;
        document.getElementById("c-" + h.key).textContent = counts[h.key];
        hint.textContent = "다시 하려면 또 누르세요";
        setTimeout(() => { busy = false; }, 700);
      }, 440);
    }, 520);
  }

  stage.addEventListener("click", play);
  stage.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); play(); } });

  // keep the screen on while playing (optional)
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
})();
</script>
</body>
</html>
